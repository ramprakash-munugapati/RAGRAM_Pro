[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragram-pro"
version = "8.0.0"
description = "Hybrid search (dense + sparse) with RRF fusion and cross-encoder reranking for precision-critical RAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "hybrid-search", "reranking", "pgvector", "bm25", "rrf"]
dependencies = []

[project.optional-dependencies]
# PostgresStorageEngine: pgvector cosine search + tsvector full-text search
postgres = ["asyncpg>=0.29.0", "pgvector>=0.3.0"]
# CohereReranker: managed reranking API
cohere = ["httpx>=0.27.0"]
# CrossEncoderReranker + SentenceTransformerEmbedder: local HuggingFace models
local = ["sentence-transformers>=3.0.0"]
all = [
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
]

[tool.setuptools]
py-modules = ["config", "embedding", "engine", "models", "prompts"]

[tool.setuptools.packages.find]
include = ["storage*", "search*", "rerank*"]

[tool.ruff]
line-length = 100
target-version = "py310"
